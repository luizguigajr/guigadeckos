# GuigaDeckOS, made with the linuxlive.com wizard on 2026-11-04.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "GuigaDeckOS"
version: "0.1"
base: ubuntu
desktop: kde
apps:
  - vlc
  - vscode
  - chromium
  - flatseal
  - firefox
  - libreoffice
flathub:
  - org.kde.kate
  - org.flameshot.Flameshot
  - org.localsend.localsend_app
  - io.missioncenter.MissionCenter
  - it.mijorus.gearlever
  - org.sqlitebrowser.sqlitebrowser
  - org.gnome.baobab
  - org.qbittorrent.qBittorrent
  - io.qt.qtdesignstudio
  - org.kde.kuiviewer
  - io.github.fastrizwaan.WineZGUI
  - io.github.jonmagon.kdiskmark
  - com.github.johnfactotum.Foliate
  - md.obsidian.Obsidian
  - org.wireshark.Wireshark
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#1a1919"
settings:
  language: pt_BR
  keyboard: "br"
  timezone: America/Sao_Paulo
  autologin: true
  dock:
    - chromium
    - org.kde.kate
    - md.obsidian.Obsidian
kiosk:
  app: vlc
persistence: true
